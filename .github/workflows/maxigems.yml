name: MaxiGems engine + site

# Public repo: Actions minutes are free/unlimited. Hosting: Cloudflare Worker 'maxigems' (static assets,
# wrangler.jsonc) builds + deploys automatically on every push to main that isn't marked [skip ci].
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub may delay scheduled runs a few minutes)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print messages, do not post to Telegram)"
        type: boolean
        default: false
      recap:
        description: "Force a top-performers recap post"
        type: boolean
        default: false

permissions:
  contents: write

# engine: one at a time, never cancelled mid-run (prevents double posts).

jobs:
  engine:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest is moving to 26.04
    concurrency:
      group: maxigems-engine
      cancel-in-progress: false
    timeout-minutes: 8
    steps:
      # Check out the branch TIP (not the trigger SHA): a run queued behind another run must see
      # that run's freshly committed state.json, otherwise it could re-post the same calls.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      # Deps: @resvg/resvg-js + sharp (prebuilt binaries) for the per-coin share cards. npm cache keyed on package-lock.json.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Safety API reachability (informational)
        continue-on-error: true
        run: |
          curl -s -m 15 -o /dev/null -w "rugcheck %{http_code}\n" https://api.rugcheck.xyz/v1/tokens/So11111111111111111111111111111111111111112/report/summary || true
          curl -s -m 15 -o /dev/null -w "solana-rpc %{http_code}\n" -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' https://api.mainnet-beta.solana.com || true
      - name: Run engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          TELEGRAM_CHANNEL_URL: ${{ vars.TELEGRAM_CHANNEL_URL }}
          # MaxiGems Pro (no-ops until set by scripts/supabase-deploy.sh): live whale moves + watchlist → Supabase
          PRO_INGEST_URL: ${{ vars.PRO_INGEST_URL }}
          PRO_INGEST_SECRET: ${{ secrets.PRO_INGEST_SECRET }}
          # repo variable DRY_RUN=1 forces dry run for every run (scheduled too); data is still tracked + committed
          DRY_RUN: ${{ (inputs.dry_run || vars.DRY_RUN == '1') && '1' || '0' }}
        run: |
          node --version
          echo "DRY_RUN=${DRY_RUN}"
          node src/index.js --once ${{ inputs.recap && '--recap' || '' }}
      - name: Commit updated data
        run: |
          git config user.name "maxigems-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json site/data/calls.json site/data/watchlist.json site/data/trending.json site/sitemap.xml
          if [ -f data/share.json ]; then git add data/share.json; fi
          for f in data/holders.json site/data/whales.json site/data/whale-moves.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if [ -d site/c ]; then git add -A site/c; fi
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          # Cloudflare Workers Builds budget: most data commits get "[skip ci]" (see scripts/build-gate.mjs)
          msg="$(node scripts/build-gate.mjs)"
          git commit -q -m "$msg"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push -q && exit 0
            sleep 5
          done
          exit 1
