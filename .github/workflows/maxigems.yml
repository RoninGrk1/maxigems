name: MaxiGems engine + site

# Public repo: Actions minutes are free/unlimited, GitHub Pages is free.
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub may delay scheduled runs a few minutes)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print messages, do not post to Telegram)"
        type: boolean
        default: false
      recap:
        description: "Force a top-performers recap post"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/maxigems.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: maxigems
  cancel-in-progress: false

jobs:
  engine:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Check out the branch TIP (not the trigger SHA): a run queued behind another run must see
      # that run's freshly committed state.json, otherwise it could re-post the same calls.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      # Node 20+ is preinstalled on ubuntu-latest and the engine has zero deps: no setup-node / npm install needed.
      - name: Run engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          TELEGRAM_CHANNEL_URL: ${{ vars.TELEGRAM_CHANNEL_URL }}
          # repo variable DRY_RUN=1 forces dry run for every run (scheduled too); data is still tracked + committed
          DRY_RUN: ${{ (inputs.dry_run || vars.DRY_RUN == '1') && '1' || '0' }}
        run: |
          node --version
          echo "DRY_RUN=${DRY_RUN}"
          node src/index.js --once ${{ inputs.recap && '--recap' || '' }}
      - name: Commit updated data
        run: |
          git config user.name "maxigems-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json site/data/calls.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "chore(data): update calls"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push -q && exit 0
            sleep 5
          done
          exit 1

  deploy:
    needs: engine
    if: always() && (needs.engine.result == 'success' || needs.engine.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # latest commit incl. fresh calls.json
          fetch-depth: 1
      - uses: actions/configure-pages@v5
        id: pages
      - name: Absolute og:image URL for link previews
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
        run: |
          base="${SITE_URL%/}/"
          sed -i "s#content=\"assets/og-image.jpg\"#content=\"${base}assets/og-image.jpg\"#g; s#<meta property=\"og:type\"#<meta property=\"og:url\" content=\"${base}\" />\n  <meta property=\"og:type\"#" site/index.html
          grep -n "og:image\"\|og:url" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
